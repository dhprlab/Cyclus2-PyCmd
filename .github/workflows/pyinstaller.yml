# PURPOSE: GitHub Actions to build & attach executables to GitHub release.
#
# SPDX-FileCopyrightText: Johannes Keyser <johannes.keyser@uni-hamburg.de>
# SPDX-License-Identifier: CC0-1.0
#
# NOTE:
# GitHub Actions artifacts and GitHub Releases are separate concepts:
# - (Executable) artifacts could be generated by any CI workflow.
# - GitHub Releases are where end users expect useful versions,
#   along with pre-built executables from the GitHub Release page.
# A release is associated with a Git tag from the version history.
# (Below, only "SemVer tags" like `v1.2.3` are considered valid.)
# The workflow below builds executables, uploads them as artifacts,
# and then downloads and attach them as GitHub Release assets.


name: Build PyInstaller executables

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'  # only match SemVer tags
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid tag format: $TAG" >&2
            exit 1
          fi

      - name: Read project version
        id: version
        shell: bash
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: python -m PyInstaller Cyclus2-PyCmd.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyclus2-PyCmd-${{ steps.version.outputs.version }}-${{ runner.os }}
          path: dist/**
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      # Each OS-specific build runs on a separate runner and then uploads the
      # built executables as workflow artifacts.
      # Those artifacts are then downloaded and attached together for a single release.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: Cyclus2-PyCmd-*
          merge-multiple: false

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          echo "Build jobs have uploaded their binaries as artifacts."
          echo "Now download and publish them as the tag release assets."
          mkdir -p release-assets-final

          find release-assets -type f -print0 | while IFS= read -r -d '' file; do
            if [[ "$file" == *.exe ]]; then
              cp "$file" "release-assets-final/Cyclus2-PyCmd-${GITHUB_REF_NAME}-windows.exe"
            else
              cp "$file" "release-assets-final/Cyclus2-PyCmd-${GITHUB_REF_NAME}-linux"
            fi
          done

          echo "Prepared files:"
          ls -l release-assets-final

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets-final/*
          generate_release_notes: true
